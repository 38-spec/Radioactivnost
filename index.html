<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Радиоактивность 📻</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Радиоактивность 📻</h1>
            <p class="subtitle">Выбери волну и слушай</p>
        </header>

        <!-- Карточки плейлистов -->
        <div class="playlists-grid" id="playlists-grid">
            <!-- Карточки генерируются через JS -->
        </div>

        <!-- Индикатор текущего трека -->
        <div class="now-playing" id="now-playing" style="display: none;">
            <div class="pulse-icon">🎵</div>
            <div class="track-info">
                <div class="track-title" id="current-title">—</div>
                <div class="track-artist" id="current-artist">—</div>
            </div>
            <div class="playlist-badge" id="current-playlist">—</div>
        </div>

        <!-- Элементы управления -->
        <div class="controls" id="controls" style="display: none;">
            <button class="control-btn" id="prev-btn">⏮</button>
            <button class="control-btn main-btn" id="play-btn">⏸</button>
            <button class="control-btn" id="next-btn"></button>
        </div>

        <!-- Прогресс-бар -->
        <div class="progress-container" id="progress-container" style="display: none;">
            <span class="time" id="current-time">0:00</span>
            <div class="progress-bar-wrap">
                <input type="range" id="progress-bar" value="0" max="100" min="0">
            </div>
            <span class="time" id="duration">0:00</span>
        </div>

        <!-- Shuffle индикатор -->
        <div class="shuffle-info" id="shuffle-info" style="display: none;">
            🔀 Случайный порядок без повторов
        </div>
    </div>

    <audio id="audio-player" preload="auto"></audio>
    <script src="script.js"></script>
</body>
</html>
