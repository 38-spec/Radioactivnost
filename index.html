<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <h1>🎧 My Playlists</h1>
    <p class="subtitle">Выбери настроение</p>
  </header>

  <main class="playlists-container" id="playlistsContainer">
    <!-- Плейлисты рендерятся через JS -->
  </main>

  <!-- Фиксированный нижний плеер -->
  <footer class="mini-player" id="miniPlayer">
    <div class="track-info">
      <div class="track-cover" id="trackCover"></div>
      <div class="track-meta">
        <div class="track-title" id="trackTitle">Не выбран трек</div>
        <div class="track-artist" id="trackArtist">—</div>
      </div>
    </div>

    <div class="player-controls">
      <button class="ctrl-btn" id="prevBtn" title="Предыдущий трек">⏮</button>
      <button class="ctrl-btn play-btn" id="playPauseBtn" title="Пауза/Воспроизведение">▶</button>
      <button class="ctrl-btn" id="shareBtn" title="Поделиться">🔗</button>
    </div>

    <audio id="audioPlayer"></audio>
  </footer>

  <script src="script.js"></script>
</body>
</html>
